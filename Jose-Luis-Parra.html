<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#01163A">
<title>Jose Luis Parra — AIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#01163A;
    --azul-medio:#0a2a5e;
    --amarillo:#FCBF00;
    --blanco:#ffffff;
    --gris-texto:#5b6b82;
    --gris-fondo:#f4f6fa;
    --radio:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#0a1f45 0%,var(--azul) 45%,#010d24 100%);
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:20px 16px;
  }
  /* textura sutil de fondo */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:26px 26px;
  }

  .card{
    position:relative;
    background:var(--blanco);
    width:100%;max-width:410px;
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
    animation:entrada .7s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes entrada{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ===== Encabezado ===== */
  .header{
    background:linear-gradient(135deg,var(--azul-medio) 0%,var(--azul) 60%);
    padding:34px 28px 64px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  /* motivo geométrico inspirado en el logo (cuadrado con esquina recortada) */
  .header::before,.header::after{
    content:'';position:absolute;border-radius:6px;opacity:.10;background:var(--blanco);
    transform:rotate(45deg);
  }
  .header::before{width:150px;height:150px;top:-60px;right:-50px}
  .header::after{width:110px;height:110px;bottom:-45px;left:-40px}
  .logo-img{max-height:118px;max-width:215px;position:relative;z-index:1}
  .logo-fallback{display:none;position:relative;z-index:1;width:190px;margin:0 auto}
  .logo-fallback svg{width:100%;height:auto;display:block}
  .linea-amarilla{position:absolute;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--amarillo),#ffd84d);z-index:2}

  /* ===== Foto ===== */
  .foto-wrap{margin-top:-56px;text-align:center;position:relative;z-index:3;animation:entrada .7s .15s cubic-bezier(.22,1,.36,1) both}
  .foto,.foto-iniciales{
    width:112px;height:112px;border-radius:50%;
    border:4px solid var(--blanco);
    box-shadow:0 8px 24px rgba(1,22,58,.28), 0 0 0 3px var(--amarillo);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .foto{object-fit:cover;background:#dfe6ef}
  .foto:hover,.foto-iniciales:hover{transform:scale(1.04);box-shadow:0 12px 30px rgba(1,22,58,.35),0 0 0 3px var(--amarillo)}
  .foto-iniciales{
    display:none;background:linear-gradient(135deg,var(--azul-medio),var(--azul));
    color:var(--amarillo);font-size:38px;font-weight:700;
    align-items:center;justify-content:center;
  }

  /* ===== Identidad ===== */
  .info{text-align:center;padding:16px 26px 4px;animation:entrada .7s .25s cubic-bezier(.22,1,.36,1) both}
  .nombre{font-size:25px;font-weight:800;color:var(--azul);letter-spacing:-.4px}
  .cargo{font-size:14.5px;font-weight:600;color:var(--azul-medio);margin-top:3px}
  .cargo::after{content:'';display:block;width:36px;height:3px;border-radius:2px;background:var(--amarillo);margin:10px auto 0}
  .empresa{font-size:12px;line-height:1.45;color:var(--gris-texto);margin-top:10px;padding:0 12px}

  /* ===== Botones de acción ===== */
  .acciones{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:20px 26px 4px;animation:entrada .7s .35s cubic-bezier(.22,1,.36,1) both}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    min-height:50px;padding:12px 10px;
    border-radius:var(--radio);
    text-decoration:none;font-size:14px;font-weight:600;
    border:1.5px solid #e6ebf3;background:var(--gris-fondo);color:var(--azul);
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
  }
  .btn svg{width:19px;height:19px;flex-shrink:0}
  .btn:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(1,22,58,.13);border-color:var(--amarillo)}
  .btn:active{transform:translateY(-1px) scale(.98)}
  .btn-wsp{color:#128c4b}
  .btn-in{color:#0a66c2}

  /* ===== Datos de contacto visibles ===== */
  .datos{margin:18px 26px 0;border-top:1px solid #edf0f6;padding-top:16px;animation:entrada .7s .45s cubic-bezier(.22,1,.36,1) both}
  .dato{
    display:flex;align-items:center;gap:13px;
    padding:10px 12px;border-radius:14px;
    text-decoration:none;
    transition:background .2s ease;
  }
  .dato:hover{background:var(--gris-fondo)}
  .dato-icono{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:var(--azul);display:flex;align-items:center;justify-content:center;
    transition:background .2s ease, transform .2s ease;
  }
  .dato:hover .dato-icono{background:var(--amarillo);transform:scale(1.06)}
  .dato-icono svg{width:17px;height:17px;fill:var(--blanco);transition:fill .2s ease}
  .dato:hover .dato-icono svg{fill:var(--azul)}
  .dato-textos{min-width:0}
  .dato-label{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#9aa7ba}
  .dato-valor{font-size:14px;font-weight:600;color:var(--azul);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== CTA guardar ===== */
  .guardar{padding:20px 26px 14px;animation:entrada .7s .55s cubic-bezier(.22,1,.36,1) both}
  .btn-guardar{
    width:100%;min-height:54px;
    border:none;border-radius:var(--radio);
    background:var(--amarillo);color:var(--azul);
    font-family:inherit;font-size:15.5px;font-weight:800;letter-spacing:.2px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 6px 18px rgba(252,191,0,.35);
    transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
  }
  .btn-guardar svg{width:19px;height:19px}
  .btn-guardar:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(252,191,0,.45);background:#ffd233}
  .btn-guardar:active{transform:scale(.98)}
  .btn-guardar.ok{background:var(--azul);color:var(--blanco);box-shadow:0 6px 18px rgba(1,22,58,.3)}

  .footer{
    text-align:center;padding:2px 26px 24px;
  }
  .inst-links{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .inst-links a{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 16px;border-radius:100px;
    border:1.5px solid #e6ebf3;background:var(--blanco);
    text-decoration:none;font-size:12.5px;font-weight:600;color:var(--azul);
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .inst-links a svg{width:14px;height:14px;fill:var(--azul-medio)}
  .inst-links a:hover{transform:translateY(-2px);border-color:var(--amarillo);box-shadow:0 6px 16px rgba(1,22,58,.10)}
  .inst-dir{
    display:inline-flex;align-items:center;gap:6px;
    margin-bottom:10px;text-decoration:none;
    font-size:11.5px;font-weight:500;color:var(--gris-texto);
    transition:color .2s ease;
  }
  .inst-dir svg{width:13px;height:13px;fill:var(--amarillo);flex-shrink:0}
  .inst-dir:hover{color:var(--azul)}

  /* ===== Foto ampliada (lightbox) ===== */
  .foto{cursor:pointer}
  .lightbox{
    position:fixed;inset:0;z-index:60;
    background:rgba(1,13,36,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s ease;cursor:pointer;
  }
  .lightbox.abierto{opacity:1;pointer-events:auto}
  .lightbox img{
    width:min(78vw,340px);aspect-ratio:1/1;object-fit:cover;
    border-radius:50%;border:4px solid var(--blanco);
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 3px var(--amarillo);
    transform:scale(.9);transition:transform .3s cubic-bezier(.22,1,.36,1);
  }
  .lightbox.abierto img{transform:scale(1)}
  .lightbox span{
    position:absolute;bottom:38px;left:0;right:0;text-align:center;
    color:rgba(255,255,255,.7);font-size:12px;letter-spacing:.6px;
  }

  @media (max-width:380px){
    .acciones{grid-template-columns:1fr 1fr;gap:9px;padding:18px 18px 2px}
    .datos{margin:16px 18px 0}
    .guardar{padding:18px 18px 12px}
    .nombre{font-size:22px}
  }
</style>
</head>

<script>
/* ============================================
   DATOS — edita esta sección para cada persona
   ============================================ */
const DATOS = {
  nombre: "Jose Luis Parra",
  nombrePila: "Jose Luis",
  apellido: "Parra",
  cargo: "Gerente",
  empresa: "Asociación de Empresas Consultoras de Ingeniería de Chile A.G.",
  telefono: "+56990211095",
  telefonoVisible: "+56 9 9021 1095",
  whatsapp: "56990211095",
  email: "gerencia@aic.cl",
  linkedin: "https://www.linkedin.com/in/jose-luis-parra-44b757135/",
  vcf: "Jose-Luis-Parra.vcf",
};
/* ============================================ */

const $ = id => document.getElementById(id);
$('v-nombre').textContent = DATOS.nombre;
$('v-cargo').textContent = DATOS.cargo;
$('v-empresa').innerHTML = 'Asociación de Empresas Consultoras<br>de Ingeniería de Chile A.G.';
$('foto-fb').textContent = DATOS.nombre.split(' ').map(p=>p[0]).slice(0,2).join('');
$('a-tel').href = 'tel:' + DATOS.telefono;
$('a-wsp').href = 'https://wa.me/' + DATOS.whatsapp;
$('a-mail').href = 'mailto:' + DATOS.email;
$('a-in').href = DATOS.linkedin;
$('d-tel').href = 'tel:' + DATOS.telefono;
$('d-tel-v').textContent = DATOS.telefonoVisible;
$('d-mail').href = 'mailto:' + DATOS.email;
$('d-mail-v').textContent = DATOS.email;
$('d-in').href = DATOS.linkedin;
document.title = DATOS.nombre + ' — AIC';

// Ampliar foto al tocarla
const fotoEl = document.querySelector('.foto');
const lightbox = $('lightbox');
if (fotoEl) {
  fotoEl.addEventListener('click', () => {
    $('lightbox-img').src = fotoEl.src;
    lightbox.classList.add('abierto');
  });
}
lightbox.addEventListener('click', () => lightbox.classList.remove('abierto'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.classList.remove('abierto'); });

function construirVcf(){
  const partes = DATOS.nombre.trim().split(' ');
  const apellido = DATOS.apellido || (partes.length > 1 ? partes.slice(1).join(' ') : '');
  const nombrePila = DATOS.nombrePila || partes[0];
  return [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:' + apellido + ';' + nombrePila + ';;;',
    'FN:' + DATOS.nombre,
    'ORG:' + DATOS.empresa,
    'TITLE:' + DATOS.cargo,
    'TEL;TYPE=CELL:' + DATOS.telefono,
    'EMAIL:' + DATOS.email,
    'TEL;TYPE=WORK:+56996348215',
    'ADR;TYPE=WORK:;;Miguel Claro 119\\, piso 2;Providencia;Santiago;;Chile',
    'URL:https://www.aic.cl',
    'URL:' + DATOS.linkedin,
    'END:VCARD'
  ].join('\r\n');
}

function confirmarBoton(texto){
  const btn = $('btn-guardar');
  btn.classList.add('ok');
  btn.innerHTML = '✓ ' + texto;
  setTimeout(()=>{ btn.classList.remove('ok');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" style="width:19px;height:19px"><path d="M15 4a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-4 6c-3.9 0-7 2.4-7 5.5V18h9.5a6 6 0 0 1 4.5-8.7c-.9-.8-2.2-1.3-3.5-1.3h-3.5zM19 13v3h3v2h-3v3h-2v-3h-3v-2h3v-3h2z" transform="translate(1 0) scale(.92)"/></svg> Guardar contacto';
  }, 2600);
}

function guardarContacto(){
  const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const publicada = location.protocol === 'http:' || location.protocol === 'https:';

  // iPhone/iPad con tarjeta publicada: abrir el .vcf del sitio —
  // Safari muestra la ficha con "Crear nuevo contacto" directamente
  if (esIOS && publicada && DATOS.vcf) {
    location.href = DATOS.vcf;
    confirmarBoton('Listo');
    return;
  }

  // Android y computadores: descarga del .vcf (Android abre Contactos al tocarlo)
  const vcf = construirVcf();
  const blob = new Blob([vcf], {type:'text/vcard;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = DATOS.nombre.replace(/\s+/g,'_') + '_AIC.vcf';
  a.click();
  confirmarBoton('Contacto descargado');
}
</script>
